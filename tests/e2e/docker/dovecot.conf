protocols = imap
listen = *
disable_plaintext_auth = no
ssl = no
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
mail_location = maildir:/mail/%u/Maildir
auth_mechanisms = plain login
passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/mail/%u
}
log_path = /dev/stderr
